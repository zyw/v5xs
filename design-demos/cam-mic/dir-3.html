<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v5xs · 隐私 · 方向三</title>
<style>
  :root{--bg:#1f2927;--card:#2b3833;--mint:#92dbb8;--blue:#85bfeb;--amber:#f5c785;--muted:#a3b5ab;--text:#eaf2ec;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111a18;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:30px}
  .pop{width:360px;background:var(--bg);border-radius:20px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.6);text-align:center}
  .statusbar{display:flex;justify-content:center;gap:24px;font-size:11px;color:var(--muted);padding-bottom:6px}
  .statusbar div{display:flex;align-items:center;gap:5px}
  .statusbar .on-c{color:var(--mint);font-weight:600}
  .statusbar .mic{color:var(--amber);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.g{background:var(--mint);box-shadow:0 0 8px var(--mint);animation:p 2s infinite}
  .dot.o{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .dot.dim{background:rgba(255,255,255,.18)}
  @keyframes p{0%,100%{box-shadow:0 0 4px var(--mint)}50%{box-shadow:0 0 14px var(--mint)}}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .hero{padding:10px 0 6px}
  .hero .cam-icon{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:rgba(146,219,184,.12);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mint);box-shadow:inset 0 0 0 1px rgba(146,219,184,.3)}
  .hero .big{font-size:22px;font-weight:800;letter-spacing:.5px}
  .hero .big .g{color:var(--mint)}
  .hero .who{font-size:14px;color:var(--text);margin-top:8px}
  .hero .since{font-size:11px;color:var(--muted);margin-top:4px}
  .hint{margin-top:14px;padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px dashed var(--line);font-size:11px;color:var(--muted);line-height:1.6}
  .foot{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:10px;color:var(--muted)}
  .foot span{display:flex;align-items:center;gap:5px}
</style>
</head>
<body>
<div class="pop">
  <div class="statusbar">
    <div class="on-c"><span class="dot g"></span>摄像头·相机</div>
    <div class="mic"><span class="dot o"></span>麦克风·听筒</div>
  </div>
  <div class="sep"></div>
  <div class="hero">
    <div class="cam-icon">📷</div>
    <div class="big">摄像头 <span class="g">正在使用</span></div>
    <div class="who">访问方：<b>微信</b></div>
    <div class="since">已占用 4 分 12 秒</div>
  </div>
  <div class="hint">若识别不到具体 App，会如实显示「有其他进程正在访问」——绝不编造名称。</div>
  <div class="foot"><span><span class="dot g"></span>设备占用中</span><span><span class="dot dim"></span>空闲</span></div>
</div>
</body>
</html>
