<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:900px;height:383px;overflow:hidden;background:#0F1714;font-family:"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:900px;height:383px;display:flex;flex-direction:column;background:linear-gradient(120deg,#0F1714,#14211C);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 26px 0}
.logobrand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8ED8B3,#3FA9A0);display:grid;place-items:center;color:#0d2418;font-weight:900;font-size:18px}
.brandname{font-size:17px;color:#EDF4EE;font-weight:700}
.brandname span{color:#8ED8B3}
.badge{font-size:12px;color:#A9BCAE;border:1px solid #2c3f34;padding:5px 12px;border-radius:30px;letter-spacing:0.04em}
.mid{padding:14px 26px 0;position:relative;z-index:2}
h1{font-size:34px;line-height:1.2;color:#F0F6F1;font-weight:800;letter-spacing:-0.01em}
h1 em{font-style:normal;color:#8ED8B3}
h1 .arrow{color:#3FA9A0}
.cards{display:flex;gap:16px;padding:14px 26px;margin-top:8px;flex:1;align-items:center}
.card{flex:1;position:relative;border-radius:14px;overflow:hidden;border:1px solid #24362c;background:#15211C;height:180px;box-shadow:0 14px 34px rgba(0,0,0,0.4)}
.card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:linear-gradient(180deg,transparent,rgba(8,14,11,0.92));font-size:12px;color:#D6E4D8;font-weight:600}
.tag{position:absolute;top:8px;left:8px;background:rgba(142,216,179,0.9);color:#0d2418;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 26px 14px;border-top:1px solid #1f2e26;margin:0 26px}
.bb1{font-size:12.5px;color:#A9BCAE}
.stars{color:#E9C87A;letter-spacing:2px;font-size:13px}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="logobrand">
      <div class="logo">V</div>
      <span class="brandname">v5xs <span>macOS 工具</span></span>
    </div>
    <span class="badge">免费 · 开源 · macOS 14+</span>
  </div>
  <div class="mid">
    <h1>三个窗口，<em>治好</em>你的 Mac <em class="arrow">强迫症</em></h1>
  </div>
  <div class="cards">
    <div class="card"><span class="tag">监控</span><img src="screenshot-monitor.png"><span class="cap">实时体检</span></div>
    <div class="card"><span class="tag">卸载</span><img src="uninstall.png"><span class="cap">残留横扫</span></div>
    <div class="card"><span class="tag">自启</span><img src="start-item.png"><span class="cap">一键管理</span></div>
  </div>
  <div class="bottom-bar"><span class="bb1">又给我挖到一款 Mac 端神仙软件</span><span class="stars">★ ★ ★ ★ ★</span></div>
</div>
</body></html>
