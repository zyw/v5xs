<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>软件卸载 方向A 健康报告</title>
<style>
:root{--bg:#131a17;--panel:#1b2520;--panel2:#202c26;--ink:#e8f0ea;--muted:#9db0a4;--faint:#70847a;--mint:#86d2a8;--ok:#7fd69f;--warn:#e9c06a;--dangerbtn:#d97f6f}
*{box-sizing:border-box}body{margin:0;min-width:1100px;background:#0c110f;color:var(--ink);font-family:"Avenir Next","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.stage{min-height:100vh;display:grid;place-items:center;padding:30px 20px}
.win{width:1120px;height:760px;display:flex;flex-direction:column;background:var(--bg);border:1px solid #31403a;border-radius:18px;overflow:hidden;box-shadow:0 34px 110px #000a}
.titlebar{position:relative;display:flex;align-items:center;height:44px;padding:0 16px;flex:none;background:#161f1b;border-bottom:1px solid #27362f}
.lights{display:flex;gap:8px}.light{width:12px;height:12px;border-radius:50%}.r{background:#e0705f}.y{background:#e2b04a}.g{background:#63c554}
.title{position:absolute;inset:0;display:grid;place-items:center;color:#8da196;font-size:12px;pointer-events:none}
.hero{padding:22px 28px 16px;display:flex;align-items:center;gap:22px;flex:none}
.gauge{display:flex;align-items:baseline;gap:10px}.gl{font-size:12px;color:var(--faint);letter-spacing:.04em}.gn{font-size:50px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#eef7f0}.gu{font-size:15px;color:var(--muted);font-weight:600}.gd{font-size:13px;color:var(--mint);font-weight:700;background:rgba(134,210,168,.14);padding:4px 10px;border-radius:999px}
.spacer{flex:1}.pills{display:flex;gap:8px}.pill{font-size:12px;padding:6px 11px;border-radius:999px;font-weight:600}.pill.ok{background:rgba(127,214,159,.16);color:var(--ok)}.pill.mut{background:rgba(157,176,164,.12);color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 28px;flex:none}
.tabs{display:flex;padding:3px;background:#1d2822;border:1px solid #2d3d35;border-radius:11px}.tabs button{border:0;background:transparent;color:#9fb3a7;padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:600}.tabs .on{background:#2c4436;color:#e6f5ec}
.tools{display:flex;align-items:center;gap:8px}.sort{display:flex;gap:2px}.sort button{border:0;background:none;color:#83978b;padding:6px 9px;border-radius:7px;font-size:12px;font-weight:600}.sort .on{color:var(--mint)}
.search{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid transparent;border-radius:9px;color:#83978b}.search:focus-within{border-color:#35503f;background:#1b2520}.search input{width:0;border:0;outline:0;background:transparent;font-size:12.5px;color:var(--ink);transition:width .18s}.search:focus-within input{width:150px}
.refresh{width:34px;height:34px;border:1px solid #2d3d35;border-radius:9px;background:#1b2520;color:var(--mint);font-size:16px}
.head{display:flex;justify-content:space-between;align-items:center;padding:2px 30px 10px;color:var(--muted);font-size:12.5px;flex:none}.head b{color:#dfe9e0;font-weight:650}.head .note{color:var(--warn);font-size:11.5px}
.list{flex:1;overflow:auto;padding:0 22px 14px}
.card{margin-bottom:9px;border:1px solid transparent;border-radius:16px;background:var(--panel);transition:border-color .15s,background .15s}.card:hover{background:var(--panel2)}.card.sel{border-color:#3d6651;background:linear-gradient(to right,#203027,#1b2922)}
.ct{display:grid;grid-template-columns:46px minmax(0,1fr) auto 30px;gap:14px;align-items:center;padding:12px 18px}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:19px;font-weight:800;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 1px 2px #ffffff55,0 5px 12px #0006}
.nm{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mt{margin-top:3px;font-size:12px;color:var(--muted)}.mt .stale{color:var(--warn)}
.rc{display:flex;align-items:center;gap:14px}.sz{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;color:#dde8dd;min-width:84px;text-align:right}
.st{font-size:11.5px;padding:4px 9px;border-radius:999px;white-space:nowrap;font-weight:600}.st.live{background:rgba(127,214,159,.15);color:var(--ok)}.st.mid{background:rgba(233,192,106,.15);color:var(--warn)}.st.old{background:rgba(157,176,164,.12);color:var(--muted)}
.chk{width:22px;height:22px;border:1px solid #6c8274;border-radius:7px;background:#131d18;display:grid;place-items:center;color:#12301f;font-size:13px;font-weight:800;padding:0}.chk.on{background:var(--mint);border-color:var(--mint)}
.fold{display:flex;align-items:center;justify-content:space-between;margin:-4px 18px 8px 78px;padding:7px 10px;border-radius:10px;background:#1c2822;font-size:12px}.fold .am{color:#c3d6c8;font-weight:600}.fold .am b{color:var(--mint);font-variant-numeric:tabular-nums}.fold button{border:0;background:none;color:var(--mint);font-size:12px;font-weight:650}
.files{margin:0 14px 14px;padding:6px 6px 4px;border-top:1px solid #35503f}.fh{display:flex;justify-content:space-between;margin:10px 0 4px;font-size:12.5px;font-weight:700}.fh span:last-child{color:#9db0a4;font-size:11.5px;font-weight:500}
.fl{display:grid;grid-template-columns:18px 100px minmax(60px,1fr) 78px 40px;gap:12px;align-items:center;min-height:32px;padding:4px 2px;font-size:12px}.fl .chk{width:17px;height:17px;border-radius:5px;font-size:11px}.fl .lab{color:#d8e5da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fl .path{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#a4b8ab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl .fsz{text-align:right;color:#c4d6c7;font-variant-numeric:tabular-nums}
.fnote{margin:6px 0 0 30px;color:#70847a;font-size:11.5px}
.footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:74px;padding:13px 28px;background:#171f1b;border-top:1px solid #27362f}
.sel{display:flex;align-items:center;gap:12px;font-size:13px;color:#cad9cc}.sel .big{font-size:26px;font-weight:800;color:#f0f7f1;font-variant-numeric:tabular-nums}.sel .lab{color:#9db0a4}.sel .cnt{font-weight:650;color:#e0ebdf}
.act{display:flex;align-items:center;gap:10px}.clear{border:0;background:none;color:var(--mint);font-size:12.5px}
.remove{min-width:170px;height:46px;padding:0 26px;border:0;border-radius:14px;background:var(--dangerbtn);color:#fff8f4;font-size:14px;font-weight:750;box-shadow:0 8px 20px #0005}.remove:disabled{background:#26352c;color:#6f8277;box-shadow:none}
.modal-back{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#070c0ae0}.modal{width:480px;padding:26px;border:1px solid #4c6858;border-radius:18px;background:#1d2822;box-shadow:0 30px 90px #000}.modal h2{margin:0 0 8px;font-size:20px}.modal p{margin:8px 0;color:#bdd0c1;font-size:13px;line-height:1.7}.modal ul{margin:10px 0 0;padding:0;list-style:none;max-height:160px;overflow:auto}.modal li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #35483d;color:#d5e2d4;font-size:12.5px}.modal li span:last-child{color:#9fb6a6;font-variant-numeric:tabular-nums}.fine{margin-top:14px;padding:8px 10px;border-radius:9px;background:#2c2a20;color:var(--warn);font-size:11.5px}.modal-act{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.modal-act button{border:0;border-radius:10px;padding:9px 18px;background:#35493c;color:#e6f0e6;font-size:12.5px}.modal-act .danger{background:var(--dangerbtn);color:#fff5f0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:12;padding:10px 16px;border-radius:10px;background:#d9f0df;color:#183726;font-size:12.5px}
</style></head>
<body><div class="stage"><div class="win">
<div class="titlebar"><div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div><div class="title">v5xs 软件卸载</div></div>
<div class="hero">
 <div class="gauge"><span class="gl">本次将释放</span><span class="gn" id="gauge">0</span><span class="gu">GB</span><span class="gd" id="gaugeN">未选择</span></div>
 <div class="spacer"></div>
 <div class="pills"><span class="pill mut">已安装 9 个应用</span><span class="pill ok" id="pillApps">已选 0 个</span></div>
</div>
<div class="toolbar">
 <div class="tabs"><button class="on">卸载</button><button>更新</button><button>启动项</button></div>
 <div class="tools"><div class="sort"><button class="on">最近使用</button><button>占用体积</button><button>名称</button><button>安装时间</button></div><label class="search">S<input placeholder="搜索应用"></label><button class="refresh">R</button></div>
</div>
<div class="head"><div><span>已安装 <b>9</b> 个应用 占用 <b>4.96 GB</b></span></div><div class="note">演示数据 不会实际删除</div></div>
<div class="list" id="list"></div>
<div class="footer"><div class="sel" id="sel"></div><div class="act"><button class="clear" id="clear" hidden>取消选择</button><button class="remove" id="remove" disabled>移到废纸篓</button></div></div>
</div></div><div id="modal"></div><div id="toast"></div>
<script>
var fmt=function(mb){return mb>=1024?(mb/1024).toFixed(2)+" GB":mb.toFixed(1)+" MB";};
var apps=[
{id:"iina",n:"IINA",v:"1.4.1",sz:209.6,st:"6个月前",live:"old",icon:"P",c:["#3b5a81","#122a46"]},
{id:"cherry",n:"Cherry Studio",v:"2.1.6",sz:1136,st:"4天前打开",live:"mid",icon:"C",c:["#dd8779","#9c5354"]},
{id:"notes",n:"v5notes",v:"1.0.2",sz:226.5,st:"2天前",live:"mid",icon:"v5",c:["#e9ad65","#a96c40"]},
{id:"xc",n:"XTerminal",v:"4.3.7",sz:493.4,st:"2天前",live:"mid",icon:"X",c:["#8dc191","#366450"]},
{id:"api",n:"Apifox",v:"2.8.47",sz:769.4,st:"2天前",live:"mid",icon:"A",c:["#e38b81","#b2525b"]},
{id:"wps",n:"WPS Office",v:"12.1",sz:1956,st:"活跃中",live:"live",icon:"W",c:["#d28b70","#97544e"]},
{id:"filee",n:"Filee",v:"1.12.0",sz:249.3,st:"2天前",live:"mid",icon:"F",c:["#a69cca","#5b689c"]},
{id:"loop",n:"Loop",v:"1.4.2",sz:31.9,st:"活跃中",live:"live",icon:"O",c:["#738bab","#3b506d"]}];
var fsI=[["App","/Applications/IINA.app","209.6 MB"],["App支持文件","~/Library/Application Support/com.colliderli.iina","26.9 MB"],["WebKit","~/Library/WebKit/com.colliderli.iina","647 KB"],["临时缓存","/private/var/folders/9m/.../C/com.colliderli.iina","205 KB"],["容器","~/Library/Containers/com.colliderli.iina.OpenInIINA","4 KB"],["最近使用",".../ApplicationRecentDocuments/com.colliderli.iina.sfl4","3 KB"],["偏好设置","~/Library/Preferences/com.colliderli.iina.plist","803 B"],["App脚本","~/Library/Application Scripts/com.colliderli.iina.OpenInIINA","0 KB"]];
function files(a){if(a.id==="iina")return fsI;return [["App","/Applications/"+a.n+".app",fmt(a.sz)],["支持文件","~/Library/Application Support/"+a.id,fmt(a.ex||a.sz*0.05)]];}
var sel=new Set(),exp=new Set(),pick=new Set();
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function mbv(f){var x=parseFloat(f[2]);if(/GB/.test(f[2]))return x*1024;if(/MB/.test(f[2]))return x;if(/KB/.test(f[2]))return x/1024;return x/1048576;}
function amt(a){return (pick.has(a.id+":app")?a.sz:0)+files(a).filter(function(f){return pick.has(a.id+":"+f[0]);}).reduce(function(s,f){return s+mbv(f);},0);}
function chk(o,attr){return '<button '+(attr||"")+' class="chk '+(o?"on":"")+'">'+(o?"OK":"")+"</button>";}
function render(){
 var html=apps.map(function(a){
  var on=sel.has(a.id),open=exp.has(a.id);
  var aSelf=pick.has(a.id+":app")?a.sz:0;
  var aFiles=files(a).filter(function(f){return pick.has(a.id+":"+f[0]);}).reduce(function(s,f){return s+mbv(f);},0);
  var extra=Math.max(0,aSelf+aFiles-a.sz);
  var detail=open?'<div class="files"><div class="fh"><span>将处理的文件 '+esc(a.n)+'</span><span>逐项核对后可取消勾选</span></div>'+files(a).map(function(f){
    var k=a.id+":"+f[0],onp=pick.has(k);
    return '<div class="fl">'+chk(onp,'data-pick="'+esc(k)+'"')+'<span class="lab">'+esc(f[0])+'</span><span class="path">'+esc(f[1])+'</span><span class="fsz">'+esc(f[2])+'</span><span></span></div>';
  }).join('')+'<div class="fnote">只列出与该应用标识完全匹配的文件，共享文件不自动勾选</div></div>':"";
  return '<div class="card '+(on?"sel":"")+'"><div class="ct">'+
   '<div class="ic" style="--c1:'+a.c[0]+';--c2:'+a.c[1]+'">'+esc(a.icon)+'</div>'+
   '<div><div class="nm">'+esc(a.n)+'</div><div class="mt">v'+a.v+' '+fmt(a.sz)+' <span class="'+(a.live==="old"?"stale":"")+'">'+esc(a.st)+'</span></div></div>'+
   '<div class="rc"><div class="sz">'+fmt(a.sz)+'</div><span class="st '+a.live+'">'+(a.live==="live"?"活跃中":esc(a.st))+'</span>'+chk(on,'data-app="'+(a.id)+'"')+'</div>'+
  '</div>'+(on?'<div class="fold"><span class="am">已选 预计 <b>'+fmt(aSelf+aFiles)+'</b>'+(extra>0.005?' <span style="color:#9db0a4">+'+fmt(extra)+'</span>':"")+'</span><span><button data-toggle="'+a.id+'">'+((open)?"收起文件 上":"查看关联文件 下")+'</button></span></div>':"")+detail+'</div>';
 }).join('');
 document.getElementById("list").innerHTML=html;
 var chosen=apps.filter(function(a){return sel.has(a.id);});
 var gb=chosen.reduce(function(s,a){return s+amt(a);},0);
 $("gauge").textContent=(gb/1024).toFixed(2);$("gaugeN").textContent=chosen.length?(chosen.length+" 个应用 "+fmt(gb)):"未选择";
 $("pillApps").textContent="已选 "+chosen.length+" 个";
 $("sel").innerHTML=chosen.length?'<span class="lab">已选</span><span class="big">'+chosen.length+'</span><span class="cnt">个应用</span><span class="lab">预计 '+fmt(gb)+'</span>':'<span style="color:#8a9d91">未选择应用 勾选后可展开关联文件</span>';
 $("remove").disabled=!chosen.length;$("remove").textContent=chosen.length?("移到废纸篓 "+chosen.length+" 项"):"移到废纸篓";$("clear").hidden=!chosen.length;
}
function pickAll(a){files(a).forEach(function(f){pick.add(a.id+":"+f[0]);});if(a.id!=="iina")pick.add(a.id+":app");}
document.getElementById("list").addEventListener("click",function(e){
 var app=e.target.closest("[data-app]"),tg=e.target.closest("[data-toggle]"),pk=e.target.closest("[data-pick]");
 if(app){var a=apps.find(function(x){return x.id===app.dataset.app;});if(!a)return;if(sel.has(a.id)){sel.delete(a.id);exp.delete(a.id);}else{sel.add(a.id);pickAll(a);}render();return;}
 if(tg){var id=tg.dataset.toggle;if(exp.has(id))exp.delete(id);else exp.add(id);render();return;}
 if(pk){var k=pk.dataset.pick;if(pick.has(k))pick.delete(k);else pick.add(k);render();}
});
$("clear").addEventListener("click",function(){sel.clear();exp.clear();render();});
$("remove").addEventListener("click",function(){var c=apps.filter(function(a){return sel.has(a.id);});
 $("modal").innerHTML='<div class="modal-back"><div class="modal"><h2>确认移入废纸篓？</h2><p>将处理 '+c.length+' 个应用及其关联文件。运行中的应用需先退出。</p><ul>'+c.map(function(a){return '<li><span>'+esc(a.n)+'</span><span>'+fmt(amt(a))+'</span></li>';}).join("")+'</ul><p class="fine">演示原型 不会移动或删除真实文件</p><div class="modal-act"><button id="cm">返回核对</button><button class="danger" id="cf">移入废纸篓（演示）</button></div></div></div>';
 $("cm").onclick=function(){$("modal").innerHTML="";};$("cf").onclick=function(){$("modal").innerHTML="";var t=document.getElementById("toast");t.innerHTML='<div class="toast">演示完成 实际会把所选文件移到废纸篓</div>';setTimeout(function(){t.innerHTML="";},2400);};});
render();
</script>
</body></html>
