<!doctype html><html><head><meta charset="utf-8"><title>启动项 三方向</title>
<style>body{margin:0;background:#17171a;color:#eef0f2;font-family:'PingFang SC',sans-serif;padding:28px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#9aa0a6;font-size:13px;margin-bottom:22px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cell{background:#202124;border:1px solid #373a40;border-radius:14px;overflow:hidden}.cell img{width:100%;display:block}.cell .cap{padding:12px 14px}.cell .cap b{font-size:14px}.cell .cap p{margin:6px 0 0;font-size:12px;color:#9aa0a6;line-height:1.55}
</style></head><body><h1>启动项界面 · 三个方向</h1><div class="sub">同样内容，三种信息组织骨架 — 请选一个</div>
<div class="board">
 <div class="cell"><img src="startup-a.png"><div class="cap"><b>A · 来源分组</b><p>按「用户登录项 / 用户代理 / 系统代理 / 守护进程」分组，路径与类型完整展示，最贴系统管理直觉。</p></div></div>
 <div class="cell"><img src="startup-b.png"><div class="cap"><b>B · 应用归属</b><p>按宿主 App 分组，一问「谁在随系统悄悄启动」，突出应用与自启项的从属关系。</p></div></div>
 <div class="cell"><img src="startup-c.png"><div class="cap"><b>C · 极简开关</b><p>顶部三张仪表卡，紧凑列表只有名称+开关，一键关掉不想要的，最轻量。</p></div></div>
</div></body></html>
