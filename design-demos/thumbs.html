<!doctype html>
<html><head><meta charset="utf-8"><title>软件卸载 三方向缩略图</title>
<style>body{margin:0;background:#17171a;color:#eef0f2;font-family:'PingFang SC',sans-serif;padding:28px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:.02em}.sub{color:#9aa0a6;font-size:13px;margin-bottom:22px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cell{background:#202124;border:1px solid #373a40;border-radius:14px;overflow:hidden}
.cell img{width:100%;display:block}
.cell .cap{padding:12px 14px}.cell .cap b{font-size:14px}.cell .cap p{margin:6px 0 0;font-size:12px;color:#9aa0a6;line-height:1.55}
</style></head><body>
<h1>软件卸载窗口 · 三个方向</h1><div class="sub">同样内容，三种骨架 — 请选一个方向</div>
<div class="board">
  <div class="cell"><img src="t1.png"><div class="cap"><b>A · 健康报告</b><p>深色延续监控面板身份，顶部「本次将释放」大读数仪表，状态色彩作结论（Oura/Apple Health 系）。</p></div></div>
  <div class="cell"><img src="t2.png"><div class="cap"><b>B · 干净列表核对</b><p>亮色纸面，Things 3 式发丝分隔与浮起核对卡，卸载 = 逐项打勾的踏实清单。</p></div></div>
  <div class="cell"><img src="t3.png"><div class="cap"><b>C · 日式目录密排</b><p>杂志目录感（BRUTUS/POPEYE），编号条目 + 黄色马克笔高亮 + 密集文件清单。</p></div></div>
</div>
</body></html>
